name: Build WORLD-EDUCATION 2.0 Offline APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'WORLD-EDUCATION-2.0-ELMANZY-IMPERIAL-APK-PROJECT.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runner already includes Android command-line tools.
      # Do not use android-actions/setup-android here: its default "tools"
      # package is obsolete and causes sdkmanager to fail before the build.
      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
          test -d "$SDK_ROOT/platforms/android-35"
          test -d "$SDK_ROOT/build-tools/35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project archive
        run: |
          test -f WORLD-EDUCATION-2.0-ELMANZY-IMPERIAL-APK-PROJECT.zip
          unzip -t WORLD-EDUCATION-2.0-ELMANZY-IMPERIAL-APK-PROJECT.zip

      - name: Extract Android project
        run: unzip -q WORLD-EDUCATION-2.0-ELMANZY-IMPERIAL-APK-PROJECT.zip

      - name: Verify Android project structure
        run: |
          test -f WE2-Offline-Android/settings.gradle
          test -f WE2-Offline-Android/app/build.gradle
          test -f WE2-Offline-Android/app/src/main/AndroidManifest.xml
          test -f WE2-Offline-Android/app/src/main/assets/www/index.html

      - name: Build debug APK
        working-directory: WE2-Offline-Android
        run: gradle assembleDebug --no-daemon

      - name: Verify APK output
        run: |
          APK="WE2-Offline-Android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WORLD-EDUCATION-2.0-ELMANZY-IMPERIAL-OFFLINE-APK
          path: WE2-Offline-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
